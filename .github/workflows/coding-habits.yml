name: Coding Habits

on:
  schedule:
    - cron: "0 1 * * *"      # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update Coding Habits section in README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SECTION_NAME: habits
          COMMIT_MESSAGE: "chore: update coding habits"
          SHOW_COMMIT: "True"          # early bird 🐤 or night owl 🦉
          SHOW_DAYS_OF_WEEK: "True"    # most productive day
          SHOW_SHORT_INFO: "True"
          SHOW_TIMEZONE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_OS: "False"             # already in WakaTime section
          SHOW_EDITORS: "False"
          SHOW_LANGUAGE: "False"
          SHOW_PROJECTS: "False"       # keeps private project names hidden
          SHOW_PROFILE_VIEWS: "False"  # already shown as a badge
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_UPDATED_DATE: "True"
